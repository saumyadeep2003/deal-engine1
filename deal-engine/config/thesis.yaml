filters:
  lookback_days: 90
  min_offering_usd: 100000          # Form D below this is noise
  max_offering_usd: 750000000       # above this is almost always a fund, not a startup raise
  exclude_public_companies: [Google, Microsoft, Amazon, Apple, Meta, Nvidia, OpenAI, Anthropic,
    Tesla, Oracle, Salesforce, IBM, Intel, Samsung, Bloomberg, Reuters]
  require_theme_match_for: [news, launch, repo, research]   # filings pass on amount+US instead
  min_composite_floor: 0.15         # below this → Pass, never reaches a model

scoring:
  weights:            # computed layer; renormalised over available features
    tier1_count: 0.25
    signal_velocity: 0.20
    theme_match: 0.15
    offering_size_fit: 0.15
    recency: 0.15
    source_diversity: 0.10
  judged_weights:     # blended only when a real (non-stub) LLM judgment exists
    founder_quality: 0.30
    moat: 0.30
    tam_confidence: 0.20
    meta_thesis_fit: 0.20
  recommendation_thresholds:   # percentile within (sector, stage) cohort
    deep_dive: 85
    watch: 55
  cohort_min_size: 20
  brief_auto_threshold_percentile: 90
  stale_days: 90

alerts:
  tier1_coinvest_min: 2
  rate_limit_per_company_hours: 24

digest:
  days: [mon, wed, fri]
  hour_local: 7
  caps:
    deals: 5
    sector_calls: 2
    news: 5
    peer_moves: 5
