# Thirdbase / 535 West Capital — investment thesis as configuration.
# Partners edit this file; no Python required.

fund:
  name: "Thirdbase / 535 West Capital"
  focus_split:            # applied as a portfolio constraint at the ranking layer
    dominant_tech: 0.60
    tactical: 0.40
  growth_yoy_target: 0.40 # 40%+ YoY for growth stage
  runway_target_years: 3
  tier1_target_count: [3, 4]
  tam_floor_usd: 1000000000
  exit_horizon_years: [3, 5]
  meta_thesis: "proprietary data moat + regulatory complexity + large addressable labor cost"

themes:
  - key: ai_infrastructure
    label: "AI Infrastructure & Compute Stack"
    keywords: [training infrastructure, synthetic data, RL environment, model eval, evals, inference optimization, small language model, SLM, edge inference, vector database, multimodal pipeline, data governance, data center, datacenter, GPU, accelerator, energy]
  - key: cybersecurity
    label: "Cybersecurity"
    keywords: [identity security, AI agent security, agent identity, cloud security, critical infrastructure, supply chain security, SOC, threat detection, zero trust, vulnerability]
  - key: defence_tech
    label: "Defence Tech"
    keywords: [autonomous systems, cyber defense, satellite, space, spacetech, counter-UAS, drone swarm, C4ISR, battlefield, defense, defence, dual-use, ISR, munitions]
  - key: robotics
    label: "Robotics & Physical AI"
    keywords: [robotics, robot, humanoid, industrial automation, logistics automation, fulfillment, robotic simulation, manipulation, embodied AI, physical AI]
  - key: energy
    label: "Energy-as-a-service"
    keywords: [nuclear, SMR, modular reactor, grid, demand response, energy storage, power infrastructure, geothermal, fusion]
  - key: ai_native_stack
    label: "AI-native stack"
    keywords: [GPU cloud, inference infrastructure, alternative compute, fine-tuning, orchestration, developer tooling, agent framework, LLM tooling, edge AI, data infrastructure, MLOps]
  - key: ai_manufacturing
    label: "AI in manufacturing / AI copilots"
    keywords: [AI copilot, sales AI, legal AI, finance AI, manufacturing AI, industrial AI, factory, SaaS replacement, workflow automation]
  - key: voice_multimodal
    label: "Voice, Audio & Multimodal AI"
    keywords: [voice synthesis, text-to-speech, speech recognition, real-time audio, low-latency speech, conversational AI, ambient interface, multimodal model, voice agent, audio AI]
  - key: fintech
    label: "Fintech & Financial Infrastructure"
    keywords: [neobank, banking infrastructure, FX, crypto infrastructure, digital assets, embedded finance, banking-as-a-service, brokerage, trading infrastructure, regtech, wealth management, payments, stablecoin]
  - key: materials
    label: "Materials Science & Advanced Manufacturing"
    keywords: [materials discovery, advanced materials, semiconductor materials, industrial chemicals, process materials, additive manufacturing, battery chemistry]
  - key: biotech_health
    label: "BioTech & Health AI"
    keywords: [drug discovery, molecular, genomics, medical imaging, clinical trial, clinical documentation, protein, biotech, health AI, diagnostics]

