# Adapter registry. Every source is wired; requires_license controls whether it
# returns real rows or an empty LicenseRequired result. Swapping in a real key
# is a config/env change only.

sources:
  - name: edgar_formd
    adapter: engine.adapters.edgar_formd.EdgarFormDAdapter
    interval_minutes: 360
    requires_license: false
    notes: "SEC EDGAR full-text search, Form D. Highest-signal free source."

  - name: rss_news
    adapter: engine.adapters.rss_news.RssNewsAdapter
    interval_minutes: 60
    requires_license: false
    feeds:
      - {name: TechCrunch, url: "https://techcrunch.com/feed/", kind: mainstream}
      - {name: TechCrunch Startups, url: "https://techcrunch.com/category/startups/feed/", kind: mainstream}
      - {name: Axios, url: "https://api.axios.com/feed/", kind: mainstream}
      - {name: Newcomer, url: "https://www.newcomer.co/feed", kind: analysis}
      - {name: Not Boring, url: "https://www.notboring.co/feed", kind: analysis}
      - {name: The Generalist, url: "https://www.generalist.com/feed.xml", kind: analysis}
      - {name: Stratechery, url: "https://stratechery.com/feed/", kind: analysis}
      - {name: The Diff (Byrne Hobart), url: "https://www.thediff.co/feed", kind: analysis}
      # Brief §5 names these under News feeds. Public RSS availability varies by
      # publisher and changes without notice — a feed that stops returning items
      # is reported by the source-health monitor (component 14) rather than
      # silently yielding nothing, which is the whole point of that component.
      - {name: Bloomberg Technology, url: "https://feeds.bloomberg.com/technology/news.rss", kind: mainstream}
      - {name: Bloomberg Markets, url: "https://feeds.bloomberg.com/markets/news.rss", kind: mainstream}
      - {name: Reuters Technology, url: "https://www.reutersagency.com/feed/?best-topics=tech&post_type=best", kind: mainstream, best_effort: true}
      - {name: FT Technology, url: "https://www.ft.com/technology?format=rss", kind: mainstream}
      - {name: Dealroom, url: "https://dealroom.co/blog/rss.xml", kind: analysis, best_effort: true}

  - name: hn
    adapter: engine.adapters.hn.HackerNewsAdapter
    interval_minutes: 120
    requires_license: false
    notes: "Algolia API: funding/launch stories + comment threads for commentary."

  - name: arxiv
    adapter: engine.adapters.arxiv.ArxivAdapter
    interval_minutes: 720
    requires_license: false
    categories: [cs.AI, cs.RO, cs.CR, eess.AS, cs.LG]

  - name: github_trending
    adapter: engine.adapters.github_trending.GithubTrendingAdapter
    interval_minutes: 720
    requires_license: false
    notes: "Real stars/contributors/velocity via public API. Unauthenticated rate limits apply."

  - name: reddit
    adapter: engine.adapters.reddit.RedditAdapter
    interval_minutes: 240
    requires_license: false
    subreddits: [startups, MachineLearning, venturecapital, robotics]
    notes: "Public JSON endpoints; degrades gracefully when Reddit blocks unauthenticated access."

  - name: careers_pages
    adapter: engine.adapters.careers.CareersAdapter
    interval_minutes: 1440
    requires_license: false
    notes: "Scrapes careers pages of pipeline companies for open req volume + function mix."

  - name: company_website
    adapter: engine.adapters.website.WebsiteAdapter
    interval_minutes: 1440
    requires_license: false
    notes: "Brief §5 'Company surface area' — product positioning, customer logos
      (from author-written alt text), pricing page + plan names. Post-filter only."

  # ---- Apify: public-web Actors. Not a licence, just an API token. ----------
  # Fills part of the gap the enterprise vendors own (traction, self-reported
  # team size, coverage beyond SEC filings) for ~$40/mo instead of ~$40k/yr.
  # Actor ids and queries are DATA: swap an Actor without touching Python.
  # Deliberately excluded: LinkedIn and X Actors. Both platforms prohibit
  # scraping in their terms; licensed routes for that data are wired in
  # licensed.py (Coresignal, X API). A tool handed to a fund should not carry
  # that liability to save a subscription.
  - name: apify
    adapter: engine.adapters.apify.ApifyAdapter
    interval_minutes: 720
    requires_license: false
    env_key: APIFY_TOKEN
    notes: "Apify Actors — funding discovery via search + company self-description crawl."
    discovery:
      actor: "apify~google-search-scraper"
      max_results: 20
      # Each query is one paid Actor run of 30-60s. 4 keeps a search under ~4 min
      # and a free Apify plan alive; raise it once you are on a paid plan.
      max_queries: 4
      queries:
        - "{theme} startup raises funding round"
    enrichment:
      actor: "apify~website-content-crawler"
      max_pages: 3

  # ---- Licensed sources: identical interface, wired end-to-end, return LicenseRequired ----
  - name: pitchbook
    adapter: engine.adapters.licensed.PitchBookAdapter
    interval_minutes: 1440
    requires_license: true
    license_vendor: PitchBook
    env_key: PITCHBOOK_API_KEY
  - name: crunchbase
    adapter: engine.adapters.licensed.CrunchbaseAdapter
