# Every model name lives here — never inline in code.
# Provider: any OpenAI-compatible endpoint. Currently NVIDIA NIM
# (integrate.api.nvidia.com) serving Thinking Machines' Inkling.
# Swapping provider = edit base_url + api_key_env + tier names. Nothing else.
provider:
  base_url: "https://integrate.api.nvidia.com/v1"
  api_key_env: "NVIDIA_API_KEY"

# Tier routing. Inkling serves all tiers for now; when NVIDIA's catalog offers a
# cheaper small model you trust, point `classify` at it and the funnel economics
# improve without touching code. (Former z.ai config: base_url
# https://api.z.ai/api/openai/v1, key ZAI_API_KEY, tiers glm-4-flash/air/plus.)
# `classify` and `chat` are quick, high-volume, low-judgment calls: a reasoning
# model spends 15-30s thinking about a question a small instruct model answers in
# about a second. `score` and `brief` are where the reasoning is worth paying for.
# Swap any line to change model routing — no code touches a model name.
tiers:
  classify: "meta/llama-3.1-8b-instruct"
  score: "thinkingmachines/inkling"
  brief: "thinkingmachines/inkling"
  chat: "meta/llama-3.1-8b-instruct"

generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 8192

# Per-stage output ceilings. Inkling is a reasoning model: given 8192 tokens it
# will happily think for minutes, and a 25-company judging pass then takes hours
# on a free endpoint. Judging needs a verdict, not an essay — the ceilings below
# are what each stage actually consumes, measured, not guessed.
max_tokens_by_stage:
  classify: 700
  score: 900
  brief: 2000
  chat: 1200

limits:
  max_briefs_per_day: 8
  # One attempt, hard-bounded. The client is created with max_retries=0 so this
  # is the true per-call ceiling; retries are handled (and logged) in llm.complete.
  request_timeout_seconds: 75
