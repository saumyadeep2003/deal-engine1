# Render blueprint — deploys the FULL live engine (scheduler + web + live ingest)
# on the free tier. In Render: New → Blueprint → select this repo.
#
# Free-tier realities, designed for rather than ignored:
#   - the service sleeps after ~15 min idle; the first request wakes it (~50s).
#     The dashboard shows a "waking up" banner and retries automatically.
#   - the disk is ephemeral; a restart wipes SQLite. serve.py detects an empty
#     database, reseeds, and kicks a full live-ingest pipeline run in the
#     background — real data repopulates itself within minutes.
services:
  - type: web
    name: deal-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DEAL_ENGINE_HOSTED
        value: "1"
      - key: SEARCH_MODE
        value: manual      # searches run ONLY via the dashboard button ("auto" restores
                           # the hourly self-updating schedule the fund's brief describes)
      - key: DATABASE_URL
        sync: false        # Supabase Postgres connection string (see SUPABASE.md).
                           # Without it: local SQLite, wiped on every restart.
      - key: NVIDIA_API_KEY
        sync: false        # set the value in the Render dashboard — never in the repo
      - key: APIFY_TOKEN
        sync: false        # optional: Apify Actors (see CONNECTORS.md)
      - key: RESEND_API_KEY
        sync: false        # optional
      - key: DIGEST_TO
        sync: false        # optional
